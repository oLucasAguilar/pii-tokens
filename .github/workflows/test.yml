name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # CI has no unlocked system keyring; a file backend stands in for it.
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned dependencies
        run: |
          python -m pip install --require-hashes -r plugin/requirements.txt
          python -m pip install keyrings.alt
      - name: Install tesseract, so the image tests run
        run: ${{ runner.os == 'Linux' && 'sudo apt-get install -y tesseract-ocr' || 'brew install tesseract' }}
      - run: make test
